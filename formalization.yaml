alignment:
  generated_from: claims.yaml
  statements:
  - source: null
    lean: WalshIntegral.WhiteNoise.exists_completed_whiteNoise
    module: WalshIntegral/WhiteNoise.lean
    kind: theorem
    claim: walsh-integral/completed-white-noise
    status: reusable
    note: Existence of compatible space-time white noise with completed natural filtration on the completed
      countable Gaussian product space.
  - source: null
    lean: WalshIntegral.Integral.integral_sq_walshL2
    module: WalshIntegral/Integral.lean
    kind: theorem
    claim: walsh-integral/ito-isometry
    status: reusable
    note: For every predictable L² integrand class, the squared Walsh integral has expectation equal to
      its positive-time space-sample squared integral.
  - source: null
    lean: WalshIntegral.Integral.walshL2_unique
    module: WalshIntegral/Integral.lean
    kind: theorem
    claim: walsh-integral/integral-unique
    status: reusable
    note: Every continuous linear map agreeing with the Walsh integral on all bounded random elementary
      integrands equals its isometric extension.
  - source: null
    lean: WalshIntegral.Rio.eLpNorm_sum_sq_le
    module: WalshIntegral/Rio.lean
    kind: theorem
    claim: walsh-integral/rio-moment
    status: reusable
    note: For real p≥2, adapted Lᵖ martingale differences obey the squared Lᵖ sum bound with factor p−1
      and explicit conditional-centering hypotheses.
  - source: null
    lean: WalshIntegral.MomentBound.eLpNorm_walshT_sq_le
    module: WalshIntegral/MomentBound.lean
    kind: theorem
    claim: walsh-integral/walsh-real-p
    status: reusable
    note: For real p≥2 and predictable input with finite mixed norm, the squared Lᵖ Walsh norm is bounded
      by (p−1)·gaussianMoment(p)² times that mixed norm.
  - source: null
    lean: WalshIntegral.Modification.exists_predictable_modification
    module: WalshIntegral/Modification.lean
    kind: theorem
    claim: walsh-integral/predictable-modification
    status: reusable
    note: For a causal L²-regular deterministic kernel and predictable input with finite variance at every
      output, the stochastic convolution has a predictable version, equal almost surely separately at
      each output.
  - source: null
    lean: WalshIntegral.Integral.integral_walshL2
    module: WalshIntegral/Integral.lean
    kind: theorem
    claim: walsh-integral/walsh-mean-zero
    status: reusable
    note: For every compatible white noise and predictable L² integrand class, the Walsh integral has
      expectation zero.
  - source: null
    lean: WalshIntegral.Predictable.measurable_timeSection
    module: WalshIntegral/Predictable.lean
    kind: theorem
    claim: walsh-integral/predictable-adapted
    status: reusable
    note: Every predictable time-space-sample field is adapted; at each time t≥0 and space point x its
      sample section is F t-measurable.
