  - source: null
    lean: WalshIntegral.Integral.walshL2_unique
    module: WalshIntegral/Integral.lean
    kind: theorem
    claim: walsh-integral/integral-unique
    status: reusable
    note: Every continuous linear map agreeing with the Walsh integral on all bounded random elementary
      integrands equals its isometric extension.
  - source: null
