name = "WalshIntegral"
version = "0.9.0"
description = "Space-time white noise and the Walsh stochastic integral, for SPDEs with rough initial data."
keywords = ["white noise", "Walsh integral", "stochastic integral", "SPDE", "Gaussian"]
license = "Apache-2.0"
defaultTargets = ["WalshIntegral"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "WalshIntegral"

[[lean_lib]]
name = "WalshIntegralTest"

[[lean_lib]]
name = "WalshIntegralChallenge"

[[lean_lib]]
name = "WalshIntegralSolution"
