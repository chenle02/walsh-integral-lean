schema: claims/1
package: walsh-integral
claims:
- id: walsh-integral/completed-white-noise
  decl: WalshIntegral.WhiteNoise.exists_completed_whiteNoise
  kind: theorem
  summary: Existence of compatible space-time white noise with completed natural filtration
    on the completed countable Gaussian product space.
  file: WalshIntegral/WhiteNoise.lean
  status: reusable
  citation: null
- id: walsh-integral/ito-isometry
  decl: WalshIntegral.Integral.integral_sq_walshL2
  kind: theorem
  summary: For every predictable L² integrand class, the squared Walsh integral has
    expectation equal to its positive-time space-sample squared integral.
  file: WalshIntegral/Integral.lean
  status: reusable
  citation: null
- id: walsh-integral/integral-unique
  decl: WalshIntegral.Integral.walshL2_unique
  kind: theorem
  summary: Every continuous linear map agreeing with the Walsh integral on all bounded
    random elementary integrands equals its isometric extension.
  file: WalshIntegral/Integral.lean
  status: reusable
  citation: null
- id: walsh-integral/rio-moment
  decl: WalshIntegral.Rio.eLpNorm_sum_sq_le
  kind: theorem
  summary: For real p≥2, adapted Lᵖ martingale differences obey the squared Lᵖ sum
    bound with factor p−1 and explicit conditional-centering hypotheses.
  file: WalshIntegral/Rio.lean
  status: reusable
  citation: null
- id: walsh-integral/walsh-real-p
  decl: WalshIntegral.MomentBound.eLpNorm_walshT_sq_le
  kind: theorem
  summary: For real p≥2 and predictable input with finite mixed norm, the squared
    Lᵖ Walsh norm is bounded by (p−1)·gaussianMoment(p)² times that mixed norm.
  file: WalshIntegral/MomentBound.lean
  status: reusable
  citation: null
- id: walsh-integral/predictable-modification
  decl: WalshIntegral.Modification.exists_predictable_modification
  kind: theorem
  summary: For a causal L²-regular deterministic kernel and predictable input with
    finite variance at every output, the stochastic convolution has a predictable
    version, equal almost surely separately at each output.
  file: WalshIntegral/Modification.lean
  status: reusable
  citation: null
- id: walsh-integral/walsh-mean-zero
  decl: WalshIntegral.Integral.integral_walshL2
  kind: theorem
  summary: For every compatible white noise and predictable L² integrand class, the
    Walsh integral has expectation zero.
  file: WalshIntegral/Integral.lean
  status: reusable
  citation: null
- id: walsh-integral/predictable-adapted
  decl: WalshIntegral.Predictable.measurable_timeSection
  kind: theorem
  summary: Every predictable time-space-sample field is adapted; at each time t≥0 and
    space point x its sample section is F t-measurable.
  file: WalshIntegral/Predictable.lean
  status: reusable
  citation: null
- id: walsh-integral/walsht-sub-elpnorm
  decl: WalshIntegral.IntegralIncrements.walshT_sub_eLpNorm
  kind: theorem
  summary: Difference L2 isometry for totalized representatives on their explicit genuine integration domains.
  file: WalshIntegral/IntegralIncrements.lean
  status: reusable
  keywords:
  - l2
  - stochastic-integral
- id: walsh-integral/enorm-sub-sq-eq-iter
  decl: WalshIntegral.IntegralIncrements.enorm_sub_sq_eq_iter
  kind: theorem
  summary: Exact iterated weighted increment formula for actual predictable L2 class witnesses, with no additional
    field continuity or measurability premise.
  file: WalshIntegral/IntegralIncrements.lean
  status: reusable
  keywords:
  - l2
  - stochastic-integral
- id: walsh-integral/enorm-sub-sq-eq-prod
  decl: WalshIntegral.IntegralIncrements.enorm_sub_sq_eq_prod
  kind: theorem
  summary: Product-measure weighted increment formula for actual predictable L2 witnesses and explicit measurable
    scalar/moment weights.
  file: WalshIntegral/IntegralIncrements.lean
  status: reusable
  keywords:
  - l2
  - stochastic-integral
- id: walsh-integral/l2-tendsto-of-summable-differences
  decl: WalshIntegral.LpConvergence.l2_tendsto_of_summable_differences
  kind: theorem
  summary: Summable actual L2 differences and full-sequence pointwise a.e. convergence identify the same L2 limit
    on a finite measure space.
  file: WalshIntegral/LpConvergence.lean
  status: reusable
  keywords:
  - l2
  - convergence
- id: walsh-integral/elpnorm-two-le-of-moment-bound
  decl: WalshIntegral.LpConvergence.eLpNorm_two_le_of_moment_bound
  kind: theorem
  summary: Square-root moment envelope bounds the L2 seminorm, without division by the envelope.
  file: WalshIntegral/LpConvergence.lean
  status: reusable
  keywords:
  - l2
  - convergence
- id: walsh-integral/tsum-elpnorm-two-lt-top-of-moment-bound
  decl: WalshIntegral.LpConvergence.tsum_eLpNorm_two_lt_top_of_moment_bound
  kind: theorem
  summary: Summable square-root coefficient envelopes bound the sum of L2 seminorms, including zero finite profile
    constant.
  file: WalshIntegral/LpConvergence.lean
  status: reusable
  keywords:
  - l2
  - convergence
