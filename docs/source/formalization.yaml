status:
  scope: Completed countable Gaussian-product white noise; genuine predictable L2 isometric integral
    and unique extension; real-p moment bounds with explicit quadratic-growth squared-norm coefficient;
    predictable convolution modifications on the full pointwise finite-variance domain. Equality is
    almost sure separately at each output. Excludes a common uncountable exceptional set, sample continuity,
    sharp linear-in-p squared-norm bounds, general Ito theory and SPDE well-posedness.
